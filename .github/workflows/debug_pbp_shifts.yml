name: Debug pbp and shift chart shape

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date with completed games (YYYY-MM-DD)"
        required: true
        default: "2026-02-01"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m backend.debug_pbp_shifts --date "${{ github.event.inputs.date }}"
