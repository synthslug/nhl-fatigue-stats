name: Daily fatigue-stats update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Specific single date to backfill (YYYY-MM-DD). Leave blank for normal lookback or a range."
        required: false
        default: ""
      start_date:
        description: "Range backfill: start date (YYYY-MM-DD). Use with end_date."
        required: false
        default: ""
      end_date:
        description: "Range backfill: end date (YYYY-MM-DD, inclusive). Use with start_date."
        required: false
        default: ""
      days:
        description: "Lookback window in days (only used if date/start_date/end_date all blank)"
        required: false
        default: "3"
      force:
        description: "Reprocess games even if already ingested (use after a pipeline bugfix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            python -m backend.ingest --start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}" $FORCE_FLAG
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            python -m backend.ingest --date "${{ github.event.inputs.date }}" $FORCE_FLAG
          else
            python -m backend.ingest --days "${{ github.event.inputs.days || '3' }}" $FORCE_FLAG
          fi

      - name: Export static JSON for the dashboard
        run: python -m backend.export_static

      - name: Commit updated data
        run: |
          git config user.name "fatigue-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "Data update: $(date -u +%Y-%m-%d)"
          git push
