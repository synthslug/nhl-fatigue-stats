name: Daily fatigue-stats update

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Specific date to backfill (YYYY-MM-DD). Leave blank for the normal daily lookback."
        required: false
        default: ""
      days:
        description: "Lookback window in days (only used if 'date' is left blank)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m backend.ingest --date "${{ github.event.inputs.date }}"
          else
            python -m backend.ingest --days "${{ github.event.inputs.days || '3' }}"
          fi

      - name: Export static JSON for the dashboard
        run: python -m backend.export_static

      - name: Commit updated data
        run: |
          git config user.name "fatigue-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "Data update: $(date -u +%Y-%m-%d)"
          git push
